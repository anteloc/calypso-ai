[project]
name = "calypso-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langcodes[data]>=3.5.1",
    "moonshine-voice>=0.1.6",
    "questionary>=2.1.1",
    "tomlkit>=0.15.2",
    "typesafe-sdk[zstd]>=0.7.5",
]

[project.scripts]
calypso-cli = "cli:main"

# Installed (editable, by `uv sync`) only so that calypso-cli is a command.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "cli"]
