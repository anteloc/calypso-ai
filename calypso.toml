# Calypso configuration, read from calypso.toml next to main.py.
# `uv run calypso-cli config` (or `uv run main.py --config`) walks you through the settings
# below, and tests the trigger.
#
# Settings. In text, $user_name and $assistant_name stand for their values, anywhere:
# "So, $user_name, what else?" (write ${user_name} when letters follow right after).
#   user_name           your name; "" for none
#   user_language       the language you speak, which she listens in: "en", "es", "de", ...
#   assistant_name      her name
#   assistant_language  the language she speaks: "en-gb", "en-us", "es-es", ...
#   assistant_voice     her voice: one of the kokoro_ voices for assistant_language
#   trigger             what you say to wake her up
#   quit_intent         examples of what you say to call a request off, in your language:
#                       Jev recognizes anything that means the same
#
# Her phrases: each is a list, and she says one of them, picked at random. In them,
# $speech is what you've said so far: "I don't know how to do that, I've heard: $speech."
#   trigger_ack         what she answers when woken (you've said nothing yet: no $speech)
#   nudge               what she says when you go quiet mid-sentence
#   goodbye             what she says when she stops waiting for the rest
#   quit_ack            what she says when you call it off ("nah, forget it")
#   dont_know           what she says when no command does what you asked

user_name = "Carlos"
user_language = "en"
assistant_name = "Calypso"
assistant_language = "en-gb"
assistant_voice = "kokoro_bf_isabella"
trigger = "$assistant_name"
quit_intent = ["nah, forget it", "leave it be", "better don't do anything"]
trigger_ack = ["Yes $user_name?"]
nudge = ["What else?"]
goodbye = ["Ok, call me if you need something else."]
quit_ack = ["Sure! We'll leave it here."]
dont_know = ["I don't know how to do that, I've heard: $speech. Call me again if you need me."]

# Describe what each command does for Jev. Calypso follows its steps in order.
# ask collects a finished answer under save_as. Later ask, say and run steps
# can use it as $name. In run scripts, quote shell variables like "$query".
# $speech is the opening request throughout the command.

[[commands]]
description = "to perform basic and advanced arithmetic operations, solving equations, graphing functions, and evaluating trigonometric expressions."
steps = [
    { say = "Opening calculator" },
    { run = "open -a calculator" },
]

[[commands]]
description = "to track tasks, schedule appointments, record deadlines, and organize time by days, weeks, and months."
steps = [
    { say = "Opening calendar" },
    { run = "open -a calendar" },
]

[[commands]]
description = "to play music, songs, albums and playlists from Spotify."
steps = [
    { say = "Playing Spotify" },
    { run = "/Applications/Spotify.app/Contents/MacOS/spotify_cli play" },
]

[[commands]]
description = "Search on the Internet, Google, Bing, or any search engine to find information on the web."
steps = [
    { ask = "What do you want me to search for?", save_as = "query" },
    { say = "A second..." },
    { run = '''
        encoded=$(printf '%s' "$query" | jq -sRr @uri) &&
            open "https://www.google.com/search?q=$encoded"
    ''' },
]

[[commands]]
description = "to provide the current date and/or time"
steps = [
    { run = "shortcuts run 'Calypso - Date and Time'" },
]

[[commands]]
description = "to show what someone just said"
steps = [
    { say = "Here is what you just said" },
    { run = '''printf '%s\n' "$speech" > /tmp/speech.txt && open /tmp/speech.txt''' },
]
