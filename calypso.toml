# Calypso configuration, read from calypso.toml next to main.py.
# `uv run calypso-cli config` (or `uv run main.py --config`) walks you through the settings
# below, and tests the trigger.
#
# Settings. In text, $user_name and $assistant_name stand for their values, anywhere:
# "So, $user_name, what else?" (write ${user_name} when letters follow right after).
#   user_name           your name; "" for none
#   user_language       the language you speak, which she listens in: "en", "es", "de", ...
#   assistant_name      her name
#   assistant_language  the language she speaks: "en-gb", "en-us", "es-es", ...
#   assistant_voice     her voice: one of the kokoro_ voices for assistant_language
#   trigger             what you say to wake her up
#   quit_intent         examples of what you say to call a request off, in your language:
#                       Jev recognizes anything that means the same
#   restart_intent      examples of restarting the conversation or rephrasing one answer
#
# Her phrases: each is a list, and she says one of them, picked at random. In them,
# $speech is what you've said so far: "I don't know how to do that, I've heard: $speech."
#   trigger_ack         what she answers when woken (you've said nothing yet: no $speech)
#   nudge               what she says when you go quiet mid-sentence
#   goodbye             what she says when she stops waiting for the rest
#   quit_ack            what she says when you call it off ("nah, forget it")
#   dont_know           what she says when no command does what you asked
#   ask_again           what she says when speech recognition garbled the current turn
#   restart_ack         what she says before restarting the whole conversation
#   rephrase_ack        what she says before repeating just the current question

user_name = "Carlos"
user_language = "en"
assistant_name = "Calypso"
assistant_language = "en-gb"
assistant_voice = "kokoro_bf_isabella"
trigger = "$assistant_name"
quit_intent = ["nah, forget it", "leave it be", "better don't do anything"]
restart_intent = ["start over", "let's begin from the beginning", "let me say that again", "let me rephrase that"]
trigger_ack = ["Yes $user_name?"]
nudge = ["What else?"]
goodbye = ["Ok, call me if you need something else."]
quit_ack = ["Sure! We'll leave it here."]
dont_know = ["I don't know how to do that, I've heard: $speech. Call me again if you need me."]
ask_again = ["I don't get it, could you say it again?"]
restart_ack = ["Let's start the whole conversation over."]
rephrase_ack = ["Let's try just this question again."]

# Describe what each command does for Jev. Calypso follows its steps in order.
# ask collects a finished answer under save_as. Later ask, say and run steps
# can use it as $name. In run scripts, quote shell variables like "$query".
# $speech is the opening request throughout the command.

[[commands]]
description = "to play music, songs, albums and playlists from Spotify."
steps = [
    { say = "Playing Spotify" },
    { run = "/Applications/Spotify.app/Contents/MacOS/spotify_cli open && sleep 3 && /Applications/Spotify.app/Contents/MacOS/spotify_cli play" },
]

[[commands]]
description = '''
For searching the web: looking something up on the Internet, whether it's facts, train times,
places, prices, how-to guides, reviews, or anything else the person wants to find online.
This is the command for any request to search, Google, look up, or find something on the Internet,
even when they haven't said what to search for yet.
'''
steps = [
    { ask = "What do you want me to search for?", save_as = "query" },
    { say = "A second..." },
    { run = '''
        encoded=$(printf '%s' "$query" | jq -sRr @uri) &&
            open "https://www.google.com/search?q=$encoded"
    ''' },
]

[[commands]]
description = "Open the Downloads folder in Finder so the user can see their downloaded files."
steps = [
    { run = 'open "$HOME/Downloads"' },
]

[[commands]]
description = "Take a screenshot of the main display and save the image on the Desktop."
steps = [
    { run = '''screencapture -mx "$HOME/Desktop/Screenshot $(date '+%Y-%m-%d at %H.%M.%S')-$$.png"''' },
    { say = "I saved the screenshot to your Desktop." },
]

[[commands]]
description = "Dictate text to the Mac clipboard so the user can paste their words into another app."
steps = [
    { ask = "What text would you like to copy?", save_as = "text" },
    { run = '''printf '%s' "$text" | LC_ALL=en_US.UTF-8 pbcopy''' },
    { say = "Copied. You can paste it now." },
]

[[commands]]
description = "Add a to-do to the default list in Apple Reminders. This creates an undated task the user can check off later."
steps = [
    { ask = "What task should I add to Reminders?", save_as = "task" },
    { run = '''
        osascript -e 'on run argv
            set taskName to item 1 of argv
            tell application "Reminders" to make new reminder at end of reminders of default list with properties {name:taskName}
        end run' -- "$task" >/dev/null
    ''' },
    { say = "Added to your reminders." },
]

[[commands]]
description = "Keep the Mac and its display awake for one hour, for example during a presentation or download."
steps = [
    { run = "caffeinate -di -t 3600 >/dev/null 2>&1 &" },
    { say = "I’ll keep your Mac awake for an hour." },
]
